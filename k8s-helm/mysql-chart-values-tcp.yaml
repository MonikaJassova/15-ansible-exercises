architecture: replication
auth:
  rootPassword: secret-root-pass
  database: my-app-db
  username: my-user
  password: my-pass

volumePermissions:
  enabled: false

initdbScripts:
  01-team-members.sql: |
    CREATE TABLE IF NOT EXISTS team_members (
      member_name VARCHAR(100) PRIMARY KEY,
      member_role VARCHAR(100) NOT NULL
    );
    INSERT INTO team_members (member_name, member_role) VALUES
      ('alice', 'developer'),
      ('bob', 'tester'),
      ('charlie', 'devops')
    ON DUPLICATE KEY UPDATE member_role = VALUES(member_role);

primary:
  persistence:
    enabled: true
    storageClass: csi-disk
    accessModes: ["ReadWriteOnce"]

secondary:
  replicaCount: 2
  persistence:
    enabled: true
    storageClass: csi-disk
    accessModes: ["ReadWriteOnce"]

global:
  security:
    allowInsecureImages: True
image:
  registry: docker.io
  tag: 8.0.30
  repository: bitnamilegacy/mysql
