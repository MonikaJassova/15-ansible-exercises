apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
data:
  01-team-members.sql: |
    CREATE TABLE IF NOT EXISTS team_members (
      member_name VARCHAR(100) PRIMARY KEY,
      member_role VARCHAR(100) NOT NULL
    );
    INSERT INTO team_members (member_name, member_role) VALUES
      ('alice', 'developer'),
      ('bob', 'tester'),
      ('charlie', 'devops')
    ON DUPLICATE KEY UPDATE member_role = VALUES(member_role);
