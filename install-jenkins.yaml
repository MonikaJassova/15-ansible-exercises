---
- name: Provision EC2 instance
  hosts: localhost
  gather_facts: no
  vars:
    ec2_key_name: myapp-key-pair
    ec2_instance_type: t3.micro
    ec2_region: eu-central-1
    ec2_image: ami-0a6793a25df710b06 # Amazon Linux 2023 kernel-6.1 AMI
    security_group: my-sg   # security group allowing SSH, HTTP (8080 for Jenkins)
  tasks:
    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        key_name: "{{ ec2_key_name }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ ec2_image }}"
        wait: yes
        region: "{{ ec2_region }}"
        count: 1
        state: started
        name: JenkinsServer
        vpc_subnet_id: subnet-0c63690d676fc4641
        security_groups:
          - "{{ security_group }}"
        network:
          assign_public_ip: yes
      register: ec2

    - name: Add new instance to host group
      add_host:
        hostname: "{{ item.public_ip_address }}"
        groupname: launched
      loop: "{{ ec2.instances }}"

    - name: Wait for SSH to come up
      wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        delay: 10
        timeout: 320
        state: started
      loop: "{{ ec2.instances }}"

- name: Configure Jenkins server
  hosts: launched
  become: yes
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: "/home/mjassova/.ssh/myapp-key-pair.pem"
  tasks:
     - name: Include tasks for amazon-linux server
       include_tasks: amazon-jenkins.yaml
       when: host_os == "amazon"
       
     - name: Include tasks for ubuntu server
       include_tasks: ubuntu-jenkins.yaml
       when: host_os == "ubuntu"
    
     - name: Print out encoded Jenkins admin password
       slurp:
         src: /var/lib/jenkins/secrets/initialAdminPassword
       register: jenkins_pwd
     - debug: msg={{ jenkins_pwd['content'] }}
