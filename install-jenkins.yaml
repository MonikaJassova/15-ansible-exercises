---
- name: Provision EC2 instance
  hosts: localhost
  gather_facts: no
  vars:
    ec2_key_name: myapp-key-pair
    ec2_instance_type: t3.micro
    ec2_region: eu-central-1
    ec2_image: ami-0a6793a25df710b06 # Amazon Linux 2023 kernel-6.1 AMI
    security_group: my-sg   # security group allowing SSH, HTTP (8080 for Jenkins)
  tasks:
    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        key_name: "{{ ec2_key_name }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ ec2_image }}"
        wait: yes
        region: "{{ ec2_region }}"
        count: 1
        state: started
        name: JenkinsServer
        vpc_subnet_id: subnet-0c63690d676fc4641
        security_groups:
          - "{{ security_group }}"
        network:
          assign_public_ip: yes
      register: ec2

    - name: Add new instance to host group
      add_host:
        hostname: "{{ item.public_ip_address }}"
        groupname: launched
      loop: "{{ ec2.instances }}"

    - name: Wait for SSH to come up
      wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        delay: 10
        timeout: 320
        state: started
      loop: "{{ ec2.instances }}"

- name: Configure Jenkins server
  hosts: launched
  become: yes
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: "/home/mjassova/.ssh/myapp-key-pair.pem"
  tasks:
     - name: Update all packages
       yum:
        name: '*'
        state: latest

     - name: Install Java 17
       yum:
        name:
          - java-17-amazon-corretto
        state: present

     - name: Add Jenkins repo
       get_url:
         url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
         dest: /etc/yum.repos.d/jenkins.repo
         mode: '0644'

     - name: Import Jenkins repo key
       rpm_key:
         state: present
         key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key

     - name: Install Jenkins
       yum:
         name: jenkins
         state: present

     - name: Start and enable Jenkins service
       systemd:
         name: jenkins
         state: started
         enabled: yes

     - name: Install Node.js (LTS) and npm repo
       shell: |
        curl -fsSL https://rpm.nodesource.com/setup_lts.x | bash -
       args:
        executable: /bin/bash

     - name: Install nodejs
       yum:
        name: nodejs
        state: present

     - name: Install Docker
       yum:
        name:
          - docker
        state: present

     - name: Add jenkins user to docker group
       user:
        name: jenkins
        groups: docker
        append: yes

     - name: Ensure docker service is running
       systemd:
        name: docker
        state: started
        enabled: yes
    
     - name: Print out encoded Jenkins admin password
       slurp:
         src: /var/lib/jenkins/secrets/initialAdminPassword
       register: jenkins_pwd
     - debug: msg={{ jenkins_pwd['content'] }}
