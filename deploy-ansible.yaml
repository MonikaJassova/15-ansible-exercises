---
- name: Provision Ansible Control Plane EC2 Instance with network
  hosts: localhost
  gather_facts: false
  vars:
    aws_region: eu-central-1
    instance_type: t3.micro
    key_name: myapp-key-pair
    ami_id: ami-0a6793a25df710b06 # Amazon Linux 2023 kernel-6.1 AMI
    cidr_block: "10.0.0.0/16"
    subnet_cidr: "10.0.1.0/24"
    my_ip: "178.249.209.168/32"

  tasks:
    - name: Check if ansible VPC exists
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "ansible"
        region: "{{ aws_region }}"
      register: vpc_info

    - name: Create VPC if it doesn't exist
      amazon.aws.ec2_vpc_net:
        name: "ansible"
        cidr_block: "{{ cidr_block }}"
        region: "{{ aws_region }}"
        state: present
      when: vpc_info.vpcs | length == 0

    - name: Set VPC ID fact
      set_fact:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        state: present
        region: "{{ aws_region }}"
      register: igw

    - name: Create public subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ subnet_cidr }}"
        az: "{{ aws_region }}a"
        state: present
        region: "{{ aws_region }}"
      register: subnet

    - name: Gather default route table for VPC
      amazon.aws.ec2_vpc_route_table_info:
        filters:
          vpc-id: "{{ vpc_id }}"
          association.main: "true"
      register: default_rt_info

    - name: Adjust default route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        route_table_id: "{{ default_rt_info.route_tables[0].id }}"
        lookup: id
        state: present
        region: "{{ aws_region }}"
        purge_routes: false
        purge_subnets: false
        subnets: ["{{ subnet.subnet.id }}"]
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw.gateway_id }}"
      register: rt

    - name: Create security group
      amazon.aws.ec2_security_group:
        name: ansible-control-sg
        description: Security group for Ansible control plane
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip }}"
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
      register: sg

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        name: ansible-control-plane
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        security_group: "{{ sg.group_id }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        image_id: "{{ ami_id }}"
        wait: true
        state: started
        network_interfaces:
          - assign_public_ip: true
      register: ec2_result

    - name: Add new instance to in-memory inventory
      add_host:
        name: "{{ item.public_ip_address }}"
        groups: ansible_control
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "/home/mjassova/.ssh/{{ key_name }}.pem"
      loop: "{{ ec2_result.instances }}"

- name: Initial setup of the server
  hosts: ansible_control
  become: true
  gather_facts: true

  tasks:
    - name: Update all packages
      yum:
        name: "*"
        state: latest

    - name: Install Ansible and boto3
      yum:
        name:
          - ansible
          - python3-boto3
        state: present

- name: Configure Ansible Control Plane
  hosts: ansible_control
  become: true
  gather_facts: true
  vars:
    local_playbooks_dir: ./ansible
    os_user: ec2-user

  tasks:
    - name: Install mysql role from galaxy
      community.general.ansible_galaxy_install:
        type: role
        name: geerlingguy.mysql

    - name: Install ansible collection for ec2 module
      community.general.ansible_galaxy_install:
        type: collection
        name: amazon.aws

    - name: Ensure .aws dir exists
      file: path=/home/{{os_user}}/.aws state=directory
    
    - name: Copy aws credentials
      copy:
          src: /home/mjassova/.aws/credentials
          dest: /home/{{os_user}}/.aws/credentials
      
    # - name: Copy private ssh key for the app servers
    #   copy:
    #       src: "{{ item }}"
    #       dest: /home/{{os_user}}/
    #       mode: 0400
    #   with_fileglob: ansible-*.pem

    - name: Get location of ansible executable
      command: 
        cmd: which ansible
      register: ansible_result

    # - name: Create Ansible working directory
    #   file:
    #     path: "{{ ansible_result }}"
    #     state: directory
    #     mode: "0755"

    - name: Copy ansible.cfg to server
      copy:
        src: ./ansible.cfg
        dest: "/home/{{ os_user }}/ansible.cfg"
        mode: "0644"

    - name: Copy all playbooks and roles
      copy:
        src: "{{ local_playbooks_dir }}/"
        dest: "/home/{{ os_user }}/playbooks/"

    - name: Set proper ownership and permissions
      file:
        path: "{{ ansible_result }}"
        owner: "{{ os_user }}"
        group: "{{ os_user }}"
        recurse: true
        mode: "0755"

    - name: Copy java jar file
      copy:
        src: build/libs/build-tools-exercises-1.0-SNAPSHOT.jar
        dest: /home/{{ os_user }}/
