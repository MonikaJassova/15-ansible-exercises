---
- name: Provision Ansible control server on a T Cloud Public ECS instance with dedicated network
  hosts: localhost
  gather_facts: false
  vars_files:
    - project-vars
  tasks:
    - name: Ensure public network (VPC) exists
      openstack.cloud.network:
        cloud: "{{ tcloud_cloud }}"
        name: "{{ vpc_public_net }}"
        state: present
      register: public_net

    - name: Ensure public subnet exists
      openstack.cloud.subnet:
        cloud: "{{ tcloud_cloud }}"
        name: "{{ vpc_public_net }}"
        network: "{{ vpc_public_net }}"
        cidr: "{{ vpc_public_subnet_cidr }}"
        is_dhcp_enabled: true
        dns_nameservers:
          - 8.8.8.8
          - 1.1.1.1
        state: present
      register: public_subnet

    - name: Ensure private network (VPC) exists
      openstack.cloud.network:
        cloud: "{{ tcloud_cloud }}"
        name: "{{ vpc_private_net }}"
        state: present
      register: private_net

    - name: Ensure private subnet exists
      openstack.cloud.subnet:
        cloud: "{{ tcloud_cloud }}"
        name: "{{ vpc_private_net }}"
        network: "{{ vpc_private_net }}"
        cidr: "{{ vpc_private_subnet_cidr }}"
        is_dhcp_enabled: true
        dns_nameservers:
          - 8.8.8.8
          - 1.1.1.1
        state: present
      register: private_subnet

    - name: Ensure router with external gateway and NAT (SNAT)
      openstack.cloud.router:
        cloud: "{{ tcloud_cloud }}"
        name: "{{ vpc_router_name }}"
        network: "{{ tcloud_external_network }}"
        enable_snat: true
        interfaces:
          - "{{ vpc_public_net }}"
          - "{{ vpc_private_net }}"
        state: present
        wait: true
      register: vpc_router

    - name: Check for existing NAT gateway
      opentelekomcloud.cloud.nat_gateway_info:
        cloud: "{{ tcloud_cloud }}"
      register: nat_gw_info

    - name: Set NAT gateway fact
      set_fact:
        nat_gw: "{{ nat_gw_info.nat_gateways | selectattr('name', 'equalto', nat_gateway_name) | first | default(none) }}"

    - name: Allocate EIP for the NAT gateway
      shell: openstack --os-cloud {{ tcloud_cloud }} floating ip create {{ tcloud_external_network }} -f value -c floating_ip_address
      register: nat_eip
      changed_when: true
      when: nat_gw is none

    - name: Ensure NAT gateway for the VPC
      opentelekomcloud.cloud.nat_gateway:
        cloud: "{{ tcloud_cloud }}"
        name: "{{ nat_gateway_name }}"
        spec: "1"
        router: "{{ vpc_router.router.id }}"
        internal_network: "{{ private_net.network.id }}"
        state: present
        wait: true
      when: nat_gw is none

    - name: Ensure SNAT rule for the private network
      opentelekomcloud.cloud.nat_snat_rule:
        cloud: "{{ tcloud_cloud }}"
        nat_gateway: "{{ nat_gateway_name }}"
        floating_ip: "{{ nat_eip.stdout }}"
        network: "{{ vpc_private_net }}"
        state: present
        wait: true
      when: nat_gw is none

    - name: Check SNAT rules on a pre-existing NAT gateway
      opentelekomcloud.cloud.nat_snat_rule_info:
        cloud: "{{ tcloud_cloud }}"
        gateway: "{{ nat_gateway_name }}"
      register: snat_info
      when: nat_gw is not none

    - name: Fail if a pre-existing gateway has no SNAT rule for the private network
      fail:
        msg: >-
          NAT gateway {{ nat_gateway_name }} exists but has no SNAT rule for
          private network {{ vpc_private_net }}; the DB server would have no
          internet access. Add the SNAT rule manually and re-run.
      when:
        - nat_gw is not none
        - snat_info.snat_rules | default([]) | selectattr('network_id', 'equalto', private_net.network.id) | list | length == 0

    - name: Ensure security group for Ansible control plane
      openstack.cloud.security_group:
        cloud: "{{ tcloud_cloud }}"
        name: ansible-control-sg
        description: Security group for Ansible control plane
        state: present
      register: control_sg

    - name: Allow SSH from my IP only
      openstack.cloud.security_group_rule:
        cloud: "{{ tcloud_cloud }}"
        security_group: "{{ control_sg.security_group.name }}"
        protocol: tcp
        port_range_min: 22
        port_range_max: 22
        remote_ip_prefix: "{{ my_ip }}"
        direction: ingress
        state: present

    - name: Launch Ansible control server on the public network
      openstack.cloud.server:
        cloud: "{{ tcloud_cloud }}"
        name: ansible-control-plane
        image: "{{ tcloud_images.ubuntu }}"
        flavor: "{{ tcloud_flavor }}"
        key_name: "{{ tcloud_key_name }}"
        security_groups:
          - "{{ control_sg.security_group.name }}"
        nics:
          - net-name: "{{ vpc_public_net }}"
        auto_ip: false
        boot_from_volume: yes
        volume_size: "{{ tcloud_volume_size_gb }}"
        terminate_volume: yes
        wait: yes
        timeout: 900
        state: present
      register: control_server

    - name: Allocate floating IP for the Ansible control server
      openstack.cloud.floating_ip:
        cloud: "{{ tcloud_cloud }}"
        network: "{{ tcloud_external_network }}"
        server: ansible-control-plane
        state: present
      register: control_fip_alloc

    - name: Gather port information
      openstack.cloud.port_info:
        cloud: "{{ tcloud_cloud }}"
      register: ports

    - name: Gather floating IP information
      openstack.cloud.floating_ip_info:
        cloud: "{{ tcloud_cloud }}"
      register: fips

    - name: Resolve control server floating IP
      set_fact:
        control_fip: "{{ (fips.floating_ips | selectattr('port_id', 'equalto', (ports.ports | selectattr('device_id', 'equalto', control_server.server.id) | first).id) | first).floating_ip_address }}"

    - name: Add control server to host group
      add_host:
        hostname: "{{ control_fip }}"
        groupname: ansible-control
        ansible_user: "{{ tcloud_login_users.ubuntu }}"
        ansible_ssh_private_key_file: "{{ tcloud_private_key }}"

    - name: Wait for SSH to come up
      wait_for:
        host: "{{ control_fip }}"
        port: 22
        delay: 10
        timeout: 600
        state: started

    - name: Print control server address
      debug:
        msg: "Ansible control plane: {{ control_fip }} (user {{ tcloud_login_users.ubuntu }})"
