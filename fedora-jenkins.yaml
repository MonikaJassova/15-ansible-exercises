- name: Update all packages
  dnf:
    name: '*'
    state: latest

- name: Install Java 21 (required by current Jenkins LTS)
  dnf:
    name:
      - java-21-openjdk
    state: present

- name: Add Jenkins repo (repo_gpgcheck verifies repomd against repomd.xml.key)
  get_url:
    url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    mode: '0644'

- name: Install Jenkins
  dnf:
    name: jenkins
    state: present

- name: Install Docker
  dnf:
    name:
      - docker
    state: present

- name: Ensure docker group exists
  group:
    name: docker
    state: present

- name: Install Node.js and npm
  dnf:
    name:
      - nodejs
      - npm
    state: present

- name: Start and enable Jenkins service
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes

- name: Ensure docker service is running
  systemd:
    name: docker
    state: started
    enabled: yes
