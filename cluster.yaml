apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cluster-ansible
  region: eu-central-1
  version: "1.34"

managedNodeGroups:
  - name: demo-nodes
    instanceType: t3.small
    desiredCapacity: 3
    minSize: 1
    maxSize: 4
    iam:
      withAddonPolicies:
        autoscaler: true
