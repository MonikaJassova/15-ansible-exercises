---
- name: Deploy MySQL Helm chart to EKS
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    eks_cluster_name: "cluster-ansible"
    namespace: "myapp"
    mysql_release_name: "mysql-release"
    values_file: "k8s-helm/mysql-chart-values-eks.yaml"
    kubeconfig: "kubeconfig_cluster-ansible"

  tasks:
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig }}"

    - name: Ensure mysql-deployment does not exist
      kubernetes.core.k8s:
        src: "k8s/mysql.yaml"
        namespace: "{{ namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        state: absent

    - name: Add MySQL Helm repository
      kubernetes.core.helm_repository:
        name: mysql
        repo_url: "https://charts.bitnami.com/bitnami"
        state: present
        kubeconfig: "{{ kubeconfig }}"

    - name: Deploy MySQL Helm chart
      kubernetes.core.helm:
        name: "{{ mysql_release_name }}"
        chart_ref: mysql
        release_namespace: "{{ namespace }}"
        values_files:
          - "{{ values_file }}"
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        state: present
      register: mysql_deploy

    - name: Display deployment status
      debug:
        msg: "Helm release result: {{ mysql_deploy.result }}"

    - name: Deploy adjusted configmap
      kubernetes.core.k8s:
        src: "k8s-helm/db-config.yaml"
        state: present
        namespace: "{{ namespace }}"

    - name: Deploy adjusted Java app
      kubernetes.core.k8s:
        src: "k8s-helm/java-app.yaml"
        state: present
        namespace: "{{ namespace }}"
