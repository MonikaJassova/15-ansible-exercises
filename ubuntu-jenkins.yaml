- name: Update apt repo cache
  apt: update_cache=yes force_apt_get=yes

- name: Install java 21 (required by current Jenkins LTS)
  apt: name=openjdk-21-jdk

- name: Add Jenkins GPG key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins.io-2026.key
    mode: '0644'

- name: Add Jenkins debian package repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins.io-2026.key] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present
    
- name: Update apt repo cache
  apt: update_cache=yes force_apt_get=yes

- name: Install Jenkins
  apt: name=jenkins

- name: Start Jenkins service
  service:
    name: jenkins
    state: started

- name: Add NodeSource repo for Node.js LTS
  shell: curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
  args:
    executable: /bin/bash

- name: Install nodejs
  apt:
    name: nodejs
    state: present

- name: Install Docker
  apt: name=docker.io

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes

- name: Start Docker
  service: 
    name: docker
    state: started
